name: Build & Deploy via SFTP

on:
  push:
    branches:
      - main

# Prevent overlapping deploys — queue rather than cancel
concurrency:
  group: sftp-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # package-lock.json is resolved by a plain `npm install` (what the dev
        # container in docker-compose.yaml runs), so `npm ci` and
        # `npm ci --legacy-peer-deps` both accept it. The flag is kept from the
        # earlier setup and is harmless.
        run: npm ci --legacy-peer-deps

      - name: Build
        # gulp build:site = clean app/ (keeps app/img/) -> copy css, fonts, js and
        # src/static/ (.htaccess, robots.txt) -> render every page + sitemap.xml
        # from data.json (scripts/build-site.js).
        # No image processing on CI: the WebP/JPEG variants in app/img/ and
        # src/img/manifest.json are committed (npm run image regenerates them).
        run: npx gulp build:site

      - name: Install lftp
        run: sudo apt-get install -y lftp

      # ── SFTP deploy ────────────────────────────────────────────────────────
      # mirror --reverse uploads local→remote, --delete removes files on the
      # remote that no longer exist locally (keeps hosting in sync with build).
      - name: Deploy via SFTP
        env:
          SFTP_HOST:        ${{ secrets.SFTP_HOST }}
          SFTP_PORT:        ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME:    ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD:    ${{ secrets.SFTP_PASSWORD }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          lftp -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            open sftp://$SFTP_USERNAME:$SFTP_PASSWORD@$SFTP_HOST:${SFTP_PORT:-22};
            mirror --reverse --delete --verbose --no-perms ./app $SFTP_REMOTE_PATH;
            quit
          "
